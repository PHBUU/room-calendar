<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบปฏิทินการใช้ห้อง | คณะสาธารณสุขศาสตร์</title>

  <!-- === ใส่ URL ของ Google Apps Script ตรงนี้ === -->
  <meta http-equiv="refresh" content="0;url=https://script.google.com/macros/s/AKfycbyUX5QATkLGx8_LzSCuUui9B4wZ81GQC9_pqPyxBYGwGOSoGIQ8nnPXhfl67IrXq_y5/exec">
  <link rel="canonical" href="https://script.google.com/macros/s/AKfycbyUX5QATkLGx8_LzSCuUui9B4wZ81GQC9_pqPyxBYGwGOSoGIQ8nnPXhfl67IrXq_y5/exec">
  <!-- ============================================= -->

  <meta name="description" content="ระบบปฏิทินการใช้ห้อง อาคารมหิตลาธิเบศร คณะสาธารณสุขศาสตร์ มหาวิทยาลัยบูรพา">
  <meta name="robots" content="noindex">

  <!-- Open Graph -->
  <meta property="og:title" content="ระบบปฏิทินการใช้ห้อง">
  <meta property="og:description" content="จองห้องประชุม/ห้องเรียน อาคารมหิตลาธิเบศร คณะสาธารณสุขศาสตร์ ม.บูรพา">
  <meta property="og:type" content="website">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 420px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    p {
      font-size: 0.9rem;
      opacity: 0.85;
      margin-bottom: 20px;
    }

    a {
      color: #fff;
      text-decoration: underline;
      font-size: 0.85rem;
    }

    a:hover { opacity: 0.8; }
  </style>

  <script>
    // === ใส่ URL ของ Google Apps Script ตรงนี้ === //
    var TARGET = 'https://script.google.com/macros/s/AKfycbyUX5QATkLGx8_LzSCuUui9B4wZ81GQC9_pqPyxBYGwGOSoGIQ8nnPXhfl67IrXq_y5/exec';
    // ============================================= //

    // ส่งต่อ query string และ hash ไปด้วย
    var params = window.location.search || '';
    var hash   = window.location.hash   || '';
    var dest   = TARGET + params + hash;

    window.location.replace(dest);
  </script>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>กำลังเปิดระบบปฏิทินการใช้ห้อง...</h1>
    <p>อาคารมหิตลาธิเบศร คณะสาธารณสุขศาสตร์<br>มหาวิทยาลัยบูรพา</p>
    <a id="fallback-link" href="#">หากไม่ redirect อัตโนมัติ คลิกที่นี่</a>
  </div>
  <script>
    document.getElementById('fallback-link').href = dest;
  </script>
</body>
</html>
