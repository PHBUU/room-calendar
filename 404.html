<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบปฏิทินการใช้ห้อง</title>

  <!-- Redirect ทุก path กลับไปหน้าหลัก -->
  <meta http-equiv="refresh" content="0;url=https://script.google.com/macros/s/AKfycbyUX5QATkLGx8_LzSCuUui9B4wZ81GQC9_pqPyxBYGwGOSoGIQ8nnPXhfl67IrXq_y5/exec">

  <script>
    var TARGET = 'https://script.google.com/macros/s/AKfycbyUX5QATkLGx8_LzSCuUui9B4wZ81GQC9_pqPyxBYGwGOSoGIQ8nnPXhfl67IrXq_y5/exec';

    // แปลง path เป็น query parameter เช่น /room → ?page=room
    var path = window.location.pathname.replace(/^\/[^/]+\//, '').replace(/\/$/, '');
    var params = window.location.search || '';
    var hash   = window.location.hash   || '';

    var dest = TARGET;
    if (path && path !== 'index.html') {
      dest += '?page=' + path.replace('.html', '');
    }
    if (params) {
      dest += (dest.includes('?') ? '&' : '?') + params.substring(1);
    }
    dest += hash;

    window.location.replace(dest);
  </script>
</head>
<body></body>
</html>
